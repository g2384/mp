<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#202522" />
    <title>Minimal Music Player</title>
    <style>
      :root {
        --page: #d9ded7;
        --surface: #f7f8f5;
        --surface-raised: #ffffff;
        --ink: #171a18;
        --muted: #68706b;
        --line: #c8cec8;
        --line-dark: #3b423e;
        --panel: #202522;
        --panel-soft: #2a302c;
        --panel-text: #f7f8f5;
        --panel-muted: #aeb7b0;
        --accent: #e65f3c;
        --accent-soft: #f2d7cf;
        --blue: #bdd6df;
        --track-accent: #f6b87c;
        --shadow: rgba(31, 37, 33, 0.18);
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        padding: 24px;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
        font-family: "Aptos", "Trebuchet MS", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: 7px;
        background: var(--accent);
        z-index: 100;
      }

      button,
      input {
        font: inherit;
      }

      button {
        touch-action: manipulation;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 3px;
      }

      .player-shell {
        width: min(1160px, 100%);
        height: min(760px, calc(100svh - 48px));
        min-height: 620px;
        display: grid;
        grid-template-columns: minmax(350px, 0.86fr) minmax(470px, 1.34fr);
        overflow: hidden;
        background: var(--surface);
        border: 1px solid #b8bfb9;
        border-radius: 8px;
        box-shadow: 0 24px 70px var(--shadow);
        animation: player-enter 420ms ease-out both;
      }

      .now-playing {
        min-width: 0;
        padding: 30px;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        color: var(--panel-text);
      }

      .playlist-header,
      .details-header,
      .transport-meta,
      .player-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .hero-content {
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .artwork {
        position: relative;
        width: min(270px, 78%);
        aspect-ratio: 1;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: var(--track-accent);
        color: var(--ink);
        box-shadow: 12px 12px 0 var(--panel-soft);
      }

      .artwork::before {
        content: "LOCAL / AUDIO";
        position: absolute;
        top: 14px;
        left: 14px;
        font-family: "Consolas", monospace;
        font-size: 0.63rem;
        font-weight: 700;
      }

      .song-icon {
        display: grid;
        place-items: center;
        width: 56%;
        aspect-ratio: 1;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
        font-size: 5.4rem;
        filter: saturate(0.88);
      }

      .artwork-index {
        position: absolute;
        right: 14px;
        bottom: 12px;
        font-family: "Consolas", monospace;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .track-meta {
        min-width: 0;
      }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--panel-muted);
        font-family: "Consolas", monospace;
        font-size: 0.68rem;
        text-transform: uppercase;
      }

      .track-title {
        margin: 0;
        max-width: 100%;
        color: var(--panel-text);
        font-family: "Bahnschrift SemiBold", "Trebuchet MS", sans-serif;
        font-size: 2.2rem;
        font-weight: 650;
        line-height: 1.04;
        overflow-wrap: anywhere;
      }

      .track-artist {
        margin: 9px 0 0;
        color: var(--panel-muted);
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .transport {
        flex-shrink: 0;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line-dark);
      }

      .transport-meta {
        gap: 16px;
        margin-bottom: 10px;
        color: var(--panel-muted);
        font-family: "Consolas", monospace;
        font-size: 0.67rem;
      }

      .now-playing-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-progress-row {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr) 38px;
        align-items: center;
        gap: 10px;
        color: var(--panel-muted);
        font-family: "Consolas", monospace;
        font-size: 0.68rem;
      }

      input[type="range"] {
        width: 100%;
        height: 4px;
        margin: 0;
        cursor: pointer;
        accent-color: var(--track-accent);
      }

      input[type="range"]:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .player-controls {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 14px;
        margin-top: 16px;
      }

      .playback-buttons {
        grid-column: 2;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .volume-control {
        grid-column: 3;
        justify-self: end;
        display: flex;
        align-items: center;
        gap: 8px;
        width: min(116px, 100%);
      }

      .volume-control input {
        min-width: 0;
      }

      .control-btn,
      .track-info-btn,
      .details-close {
        padding: 0;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-dark);
        border-radius: 50%;
        background: transparent;
        color: var(--panel-text);
        cursor: pointer;
      }

      .control-btn {
        width: 42px;
        height: 42px;
      }

      .control-btn:hover,
      .control-btn:focus-visible {
        background: var(--panel-soft);
      }

      .control-btn:active,
      .track-info-btn:active,
      .details-close:active {
        transform: scale(0.94);
      }

      .control-btn:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .play-toggle {
        width: 54px;
        height: 54px;
        border-color: var(--track-accent);
        background: var(--track-accent);
        color: var(--ink);
      }

      .play-toggle:hover,
      .play-toggle:focus-visible {
        background: var(--track-accent);
        filter: brightness(0.96);
      }

      .volume-btn {
        width: 32px;
        height: 32px;
        border-color: transparent;
      }

      .control-btn svg,
      .track-info-btn svg,
      .details-close svg {
        width: 18px;
        height: 18px;
        stroke-width: 1.9;
      }

      .play-toggle svg {
        width: 21px;
        height: 21px;
        fill: currentColor;
      }

      .icon-fallback {
        line-height: 1;
      }

      .icons-ready .icon-fallback {
        display: none;
      }

      .playlist-panel {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        background: var(--surface);
      }

      .playlist-header {
        min-height: 104px;
        padding: 26px 30px 20px;
        border-bottom: 1px solid var(--line);
      }

      .playlist-heading {
        margin: 0;
        font-family: "Bahnschrift SemiBold", "Trebuchet MS", sans-serif;
        font-size: 2rem;
        font-weight: 650;
      }

      .playlist-subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .playlist-total {
        color: var(--muted);
        font-family: "Consolas", monospace;
        font-size: 0.72rem;
      }

      .track-list {
        min-height: 0;
        margin: 0;
        padding: 8px 18px 18px;
        overflow-y: auto;
        list-style: none;
        scrollbar-color: #aeb5af transparent;
        scrollbar-width: thin;
      }

      .track-list::-webkit-scrollbar {
        width: 8px;
      }

      .track-list::-webkit-scrollbar-thumb {
        background: #aeb5af;
        border: 2px solid var(--surface);
        border-radius: 8px;
      }

      .track-item {
        position: relative;
        min-height: 68px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 38px;
        align-items: stretch;
        border-bottom: 1px solid #dce0dc;
        animation: track-enter 320ms ease-out both;
        animation-delay: calc(var(--item-order, 0) * 35ms);
      }

      .track-item::before {
        content: "";
        position: absolute;
        inset: 10px auto 10px 0;
        width: 3px;
        background: transparent;
      }

      .track-item.active::before {
        background: var(--track-accent);
      }

      .track-item.active {
        background: var(--surface-raised);
      }

      .track-select {
        min-width: 0;
        padding: 10px 8px 10px 13px;
        display: grid;
        grid-template-columns: 32px 42px minmax(0, 1fr) auto;
        align-items: center;
        gap: 12px;
        border: 0;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .track-select:hover .track-name,
      .track-select:focus-visible .track-name {
        color: var(--accent);
      }

      .track-number {
        color: #929a94;
        font-family: "Consolas", monospace;
        font-size: 0.68rem;
        text-align: right;
      }

      .track-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid #ccd2cd;
        border-radius: 4px;
        background: #edf0ec;
        font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
        font-size: 1.35rem;
      }

      .track-copy {
        min-width: 0;
      }

      .track-name,
      .track-artist-small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .track-name {
        font-family: "Bahnschrift SemiBold", "Trebuchet MS", sans-serif;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .track-artist-small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .track-metrics {
        display: grid;
        justify-items: end;
        gap: 3px;
        color: var(--muted);
        font-family: "Consolas", monospace;
        font-size: 0.64rem;
      }

      .track-info-btn {
        align-self: center;
        width: 30px;
        height: 30px;
        border-color: transparent;
        color: var(--muted);
      }

      .track-info-btn:hover,
      .track-info-btn:focus-visible,
      .track-info-btn[aria-expanded="true"] {
        border-color: var(--line);
        background: var(--surface-raised);
        color: var(--ink);
      }

      .track-info-btn svg {
        width: 16px;
        height: 16px;
      }

      .empty-state {
        padding: 32px 14px;
        color: var(--muted);
        text-align: center;
      }

      .track-info {
        display: none;
        max-height: 190px;
        padding: 18px 30px 22px;
        overflow: auto;
        border-top: 1px solid var(--line);
        background: var(--accent-soft);
      }

      .track-info.visible {
        display: block;
        animation: details-enter 180ms ease-out both;
      }

      .details-kicker {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-family: "Consolas", monospace;
        font-size: 0.62rem;
        text-transform: uppercase;
      }

      .details-title {
        display: block;
        max-width: 34rem;
        overflow: hidden;
        color: var(--ink);
        font-size: 0.86rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .details-close {
        width: 30px;
        height: 30px;
        border-color: rgba(23, 26, 24, 0.18);
        color: var(--ink);
      }

      .track-info pre {
        margin: 13px 0 0;
        color: #3f4842;
        font-family: "Consolas", monospace;
        font-size: 0.7rem;
        line-height: 1.55;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @keyframes player-enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes track-enter {
        from {
          opacity: 0;
          transform: translateX(8px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes details-enter {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        body {
          height: 100vh;
          height: 100svh;
          padding: 0;
          display: block;
          overflow: hidden;
        }

        .player-shell {
          width: 100%;
          height: 100vh;
          height: 100svh;
          min-height: 0;
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .now-playing {
          min-height: 0;
          padding: 24px;
        }

        .hero-content {
          display: grid;
          grid-template-columns: minmax(150px, 210px) minmax(0, 1fr);
          align-items: center;
          gap: 28px;
          padding-bottom: 18px;
          border-bottom: 1px solid var(--line-dark);
        }

        .artwork {
          width: 100%;
          margin: 0;
        }

        .track-title {
          font-size: 2rem;
        }

        .transport {
          margin-top: 0;
          padding-top: 18px;
          border-top: 0;
        }

        .transport-meta {
          position: absolute;
          width: 1px;
          height: 1px;
          padding: 0;
          margin: -1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          clip-path: inset(50%);
          white-space: nowrap;
          border: 0;
        }

        .playlist-panel {
          min-height: 0;
          overflow: hidden;
        }

        .track-list {
          overflow-y: auto;
          overscroll-behavior: contain;
        }
      }

      @media (max-width: 560px) {
        .now-playing {
          min-height: 0;
          padding: 20px 18px;
        }

        .hero-content {
          grid-template-columns: clamp(92px, 27vw, 108px) minmax(0, 1fr);
          gap: clamp(14px, 4vw, 18px);
          padding-bottom: 16px;
        }

        .artwork {
          box-shadow: 7px 7px 0 var(--panel-soft);
        }

        .artwork::before {
          top: 8px;
          left: 8px;
          font-size: 0.48rem;
        }

        .song-icon {
          font-size: 2.8rem;
        }

        .artwork-index {
          right: 8px;
          bottom: 7px;
          font-size: 0.56rem;
        }

        .track-title {
          font-size: 1.5rem;
        }

        .track-artist {
          font-size: 0.8rem;
        }

        .transport {
          margin-top: 0;
          padding-top: 14px;
        }

        .player-controls {
          grid-template-columns: 1fr auto 1fr;
        }

        .volume-control {
          width: 34px;
        }

        .volume-control input {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          clip-path: inset(50%);
          white-space: nowrap;
        }

        .playlist-header {
          min-height: 80px;
          padding: 18px 18px 14px;
        }

        .playlist-heading {
          font-size: 1.65rem;
        }

        .track-list {
          padding: 6px 10px 14px;
        }

        .track-item {
          grid-template-columns: minmax(0, 1fr) 34px;
        }

        .track-select {
          grid-template-columns: 24px 38px minmax(0, 1fr) auto;
          gap: 9px;
          padding-left: 5px;
        }

        .track-icon {
          width: 38px;
          height: 38px;
          font-size: 1.2rem;
        }

        .track-metrics span:first-child {
          display: none;
        }

        .track-info {
          padding: 16px 18px 20px;
        }
      }

      @media (max-width: 390px) {
        .track-number {
          display: none;
        }

        .song-icon {
          font-size: 2.3rem;
        }

        .track-title {
          font-size: 1.3rem;
        }

        .track-select {
          grid-template-columns: 38px minmax(0, 1fr) auto;
        }

        .control-btn {
          width: 38px;
          height: 38px;
        }

        .play-toggle {
          width: 50px;
          height: 50px;
        }
      }

      @media (max-width: 900px) and (max-height: 650px) {
        .now-playing {
          padding: 12px 18px;
        }

        .hero-content {
          grid-template-columns: 88px minmax(0, 1fr);
          gap: 14px;
          padding-bottom: 10px;
        }

        .artwork {
          box-shadow: 6px 6px 0 var(--panel-soft);
        }

        .artwork::before {
          top: 7px;
          left: 7px;
          font-size: 0.43rem;
        }

        .song-icon {
          font-size: 2.25rem;
        }

        .artwork-index {
          right: 7px;
          bottom: 6px;
          font-size: 0.5rem;
        }

        .track-title {
          font-size: 1.25rem;
        }

        .transport {
          margin-top: 0;
          padding-top: 10px;
        }

        .transport-meta {
          margin-bottom: 6px;
        }

        .player-controls {
          margin-top: 8px;
        }

        .control-btn {
          width: 36px;
          height: 36px;
        }

        .play-toggle {
          width: 44px;
          height: 44px;
        }

        .playlist-header {
          min-height: 64px;
          padding: 10px 18px;
        }

        .playlist-heading {
          font-size: 1.35rem;
        }

        .playlist-subtitle {
          margin-top: 2px;
        }
      }

      @media (min-width: 561px) and (max-width: 900px) and (max-height: 650px) {
        .player-shell {
          grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
          grid-template-rows: minmax(0, 1fr);
        }

        .hero-content {
          grid-template-columns: 104px minmax(0, 1fr);
        }

        .artwork::before {
          top: 8px;
          left: 8px;
          font-size: 0.46rem;
        }

        .song-icon {
          font-size: 2.7rem;
        }

        .artwork-index {
          right: 8px;
          bottom: 7px;
          font-size: 0.54rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="player-shell">
      <section class="now-playing" aria-labelledby="trackTitle">
        <div class="hero-content">
          <div class="artwork" id="artwork" aria-label="Current track artwork">
            <span class="song-icon" id="songIcon" aria-hidden="true">♪</span>
            <span class="artwork-index" id="artworkIndex">00 / 00</span>
          </div>

          <div class="track-meta">
            <p class="eyebrow">Now playing</p>
            <h1 class="track-title" id="trackTitle">Loading collection</h1>
            <p class="track-artist" id="trackArtist">Local Collection</p>
          </div>
        </div>

        <div class="transport">
          <div class="transport-meta">
            <span class="now-playing-title" id="nowPlayingTitle" aria-live="polite">Preparing player</span>
            <span id="trackPosition">00 / 00</span>
          </div>

          <div class="player-progress-row">
            <span id="currentTime">0:00</span>
            <input id="progress" type="range" min="0" max="100" step="0.1" value="0" aria-label="Track progress" disabled />
            <span id="totalTime">0:00</span>
          </div>

          <div class="player-controls" aria-label="Player controls">
            <div class="playback-buttons">
              <button class="control-btn" id="prevBtn" type="button" aria-label="Previous track" title="Previous track" disabled>
                <span class="icon-fallback" aria-hidden="true">|◀</span>
                <i data-lucide="skip-back" aria-hidden="true"></i>
              </button>
              <button class="control-btn play-toggle" id="playPauseBtn" type="button" aria-label="Play" title="Play" disabled>
                <span class="icon-fallback" aria-hidden="true">▶</span>
                <i data-lucide="play" aria-hidden="true"></i>
              </button>
              <button class="control-btn" id="nextBtn" type="button" aria-label="Next track" title="Next track" disabled>
                <span class="icon-fallback" aria-hidden="true">▶|</span>
                <i data-lucide="skip-forward" aria-hidden="true"></i>
              </button>
            </div>

            <div class="volume-control">
              <button class="control-btn volume-btn" id="volumeBtn" type="button" aria-label="Mute" title="Mute">
                <span class="icon-fallback" aria-hidden="true">♪</span>
                <i data-lucide="volume-2" aria-hidden="true"></i>
              </button>
              <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume" />
            </div>
          </div>
        </div>
      </section>

      <section class="playlist-panel" aria-labelledby="playlistHeading">
        <header class="playlist-header">
          <div>
            <h2 class="playlist-heading" id="playlistHeading">Playlist</h2>
            <p class="playlist-subtitle">Local collection</p>
          </div>
          <span class="playlist-total" id="playlistTotal">00 songs</span>
        </header>

        <ol class="track-list" id="trackList" aria-label="Track list">
          <li class="empty-state">Loading playlist...</li>
        </ol>

        <aside class="track-info" id="trackInfo" aria-hidden="true" aria-live="polite">
          <div class="details-header">
            <div>
              <span class="details-kicker">Track details</span>
              <strong class="details-title" id="infoTitle">Selected track</strong>
            </div>
            <button class="details-close" id="closeInfoBtn" type="button" aria-label="Close track details" title="Close track details">
              <span class="icon-fallback" aria-hidden="true">×</span>
              <i data-lucide="x" aria-hidden="true"></i>
            </button>
          </div>
          <pre id="infoJson"></pre>
        </aside>
      </section>
    </main>

    <audio id="audio" preload="auto"></audio>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script>
      let tracks = [];
      let currentIndex = 0;
      let infoTrackIndex = null;
      let isPlaying = false;
      let lastVolume = 0.8;

      const audio = document.getElementById("audio");
      const artwork = document.getElementById("artwork");
      const artworkIndex = document.getElementById("artworkIndex");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const volumeBtn = document.getElementById("volumeBtn");
      const volumeInput = document.getElementById("volume");
      const trackTitle = document.getElementById("trackTitle");
      const trackArtist = document.getElementById("trackArtist");
      const songIcon = document.getElementById("songIcon");
      const currentTimeEl = document.getElementById("currentTime");
      const totalTimeEl = document.getElementById("totalTime");
      const progressInput = document.getElementById("progress");
      const trackList = document.getElementById("trackList");
      const trackInfo = document.getElementById("trackInfo");
      const infoTitle = document.getElementById("infoTitle");
      const infoJson = document.getElementById("infoJson");
      const closeInfoBtn = document.getElementById("closeInfoBtn");
      const nowPlayingTitle = document.getElementById("nowPlayingTitle");
      const trackPosition = document.getElementById("trackPosition");
      const playlistTotal = document.getElementById("playlistTotal");

      function formatTime(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "0:00";

        const wholeSeconds = Math.floor(seconds);
        const mins = Math.floor(wholeSeconds / 60);
        const secs = String(wholeSeconds % 60).padStart(2, "0");
        return `${mins}:${secs}`;
      }

      function formatTrackDisplay(track) {
        const size = Number.isFinite(track.sizeMB) ? `${Number(track.sizeMB).toFixed(2)} MB` : "0.00 MB";
        const duration = track.length || "0:00";
        return { size, duration };
      }

      function trackSortKey(track, normalizeText = true) {
        const key = [track.artist, track.title, track.id, track.file]
          .map((value) => String(value ?? ""))
          .join("\u0000");

        if (!normalizeText) return key;

        return key
          .normalize("NFKD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function compareTracksLexically(left, right) {
        const leftNormalized = trackSortKey(left);
        const rightNormalized = trackSortKey(right);

        if (leftNormalized < rightNormalized) return -1;
        if (leftNormalized > rightNormalized) return 1;

        const leftExact = trackSortKey(left, false);
        const rightExact = trackSortKey(right, false);

        if (leftExact < rightExact) return -1;
        if (leftExact > rightExact) return 1;
        return 0;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function iconMarkup(name, fallback) {
        return `<span class="icon-fallback" aria-hidden="true">${fallback}</span><i data-lucide="${name}" aria-hidden="true"></i>`;
      }

      function refreshIcons() {
        if (!window.lucide) return;
        window.lucide.createIcons();
        document.documentElement.classList.add("icons-ready");
      }

      function setControlsEnabled(enabled) {
        playPauseBtn.disabled = !enabled;
        prevBtn.disabled = !enabled;
        nextBtn.disabled = !enabled;
        progressInput.disabled = !enabled;
      }

      function updatePlayButton() {
        const iconName = isPlaying ? "pause" : "play";
        const label = isPlaying ? "Pause" : "Play";
        const fallback = isPlaying ? "Ⅱ" : "▶";

        playPauseBtn.innerHTML = iconMarkup(iconName, fallback);
        playPauseBtn.setAttribute("aria-label", label);
        playPauseBtn.title = label;
        refreshIcons();
      }

      function updateVolumeButton() {
        const effectiveVolume = audio.muted ? 0 : audio.volume;
        const iconName = effectiveVolume === 0 ? "volume-x" : effectiveVolume < 0.5 ? "volume-1" : "volume-2";
        const label = audio.muted || effectiveVolume === 0 ? "Unmute" : "Mute";
        const fallback = effectiveVolume === 0 ? "×" : "♪";

        volumeBtn.innerHTML = iconMarkup(iconName, fallback);
        volumeBtn.setAttribute("aria-label", label);
        volumeBtn.title = label;
        volumeInput.value = String(effectiveVolume);
        refreshIcons();
      }

      function updateTrackMeta() {
        const currentTrack = tracks[currentIndex] || {};
        const { duration } = formatTrackDisplay(currentTrack);
        const position = tracks.length ? `${String(currentIndex + 1).padStart(2, "0")} / ${String(tracks.length).padStart(2, "0")}` : "00 / 00";

        songIcon.textContent = currentTrack.icon || "♪";
        artwork.setAttribute("aria-label", `${currentTrack.title || "Current track"} artwork`);
        artworkIndex.textContent = position;
        trackPosition.textContent = position;
        totalTimeEl.textContent = duration;
        document.documentElement.style.setProperty("--track-accent", currentTrack.accent || "#f6b87c");
      }

      function updateInfoPanel(index) {
        const selectedTrack = tracks[index] || {};
        infoTitle.textContent = selectedTrack.title || "Selected track";
        infoJson.textContent = JSON.stringify(selectedTrack.extra || {}, null, 2);
      }

      function syncInfoButtons() {
        trackList.querySelectorAll(".track-info-btn").forEach((button) => {
          const buttonIndex = Number(button.dataset.infoIndex);
          button.setAttribute("aria-expanded", String(buttonIndex === infoTrackIndex && trackInfo.classList.contains("visible")));
        });
      }

      function closeInfoPanel() {
        infoTrackIndex = null;
        trackInfo.classList.remove("visible");
        trackInfo.setAttribute("aria-hidden", "true");
        syncInfoButtons();
      }

      function toggleInfoPanel(index) {
        const isOpen = infoTrackIndex === index && trackInfo.classList.contains("visible");
        if (isOpen) {
          closeInfoPanel();
          return;
        }

        infoTrackIndex = index;
        updateInfoPanel(index);
        trackInfo.classList.add("visible");
        trackInfo.setAttribute("aria-hidden", "false");
        syncInfoButtons();
      }

      function renderPlaylist() {
        if (!tracks.length) {
          trackList.innerHTML = '<li class="empty-state">Playlist unavailable.</li>';
          return;
        }

        trackList.innerHTML = tracks
          .map((track, index) => {
            const isActive = index === currentIndex;
            const { size, duration } = formatTrackDisplay(track);
            const number = String(index + 1).padStart(2, "0");
            const title = escapeHtml(track.title || "Untitled track");
            const artist = escapeHtml(track.artist || "Unknown artist");
            const icon = escapeHtml(track.icon || "♪");

            return `
              <li class="track-item${isActive ? " active" : ""}" style="--item-order: ${index}" data-index="${index}">
                <button class="track-select" type="button" data-track-index="${index}" aria-label="Play ${title}"${isActive ? ' aria-current="true"' : ""}>
                  <span class="track-number">${number}</span>
                  <span class="track-icon" aria-hidden="true">${icon}</span>
                  <span class="track-copy">
                    <strong class="track-name">${title}</strong>
                    <small class="track-artist-small">${artist}</small>
                  </span>
                  <span class="track-metrics" aria-label="${escapeHtml(size)}, ${escapeHtml(duration)}">
                    <span>${escapeHtml(size)}</span>
                    <span>${escapeHtml(duration)}</span>
                  </span>
                </button>
                <button
                  class="track-info-btn"
                  type="button"
                  data-info-index="${index}"
                  aria-label="Toggle details for ${title}"
                  aria-expanded="${index === infoTrackIndex && trackInfo.classList.contains("visible")}"
                  title="Track details"
                >${iconMarkup("info", "i")}</button>
              </li>
            `;
          })
          .join("");

        refreshIcons();
      }

      function setTrackVisuals() {
        const currentTrack = tracks[currentIndex] || {};
        trackTitle.textContent = currentTrack.title || "Untitled track";
        trackArtist.textContent = currentTrack.artist || "Local Collection";
        nowPlayingTitle.textContent = currentTrack.title || "";
        updateTrackMeta();
        renderPlaylist();
      }

      async function loadTrackData() {
        try {
          const [manualResponse, generatedResponse] = await Promise.all([
            fetch("song-metadata.json"),
            fetch("song-generated.json")
          ]);

          if (!manualResponse.ok || !generatedResponse.ok) {
            throw new Error("Playlist JSON files are missing.");
          }

          const manualPayload = await manualResponse.json();
          const generatedPayload = await generatedResponse.json();
          const manualList = Array.isArray(manualPayload?.tracks) ? manualPayload.tracks : [];
          const generatedMap = new Map();

          for (const track of Array.isArray(generatedPayload?.tracks) ? generatedPayload.tracks : []) {
            const key = track.id || track.file;
            if (key) generatedMap.set(key, track);
          }

          tracks = manualList
            .map((track) => {
              const key = track.id || track.file;
              const generated = generatedMap.get(key) || generatedMap.get(track.file) || {};
              return {
                ...track,
                ...generated,
                extra: {
                  ...(track.extra || {}),
                  ...(generated.extra || {})
                }
              };
            })
            .sort(compareTracksLexically);
        } catch (error) {
          console.error(error);
          tracks = [];
        }

        playlistTotal.textContent = `${String(tracks.length).padStart(2, "0")} ${tracks.length === 1 ? "song" : "songs"}`;

        if (!tracks.length) {
          trackTitle.textContent = "Playlist unavailable";
          trackArtist.textContent = "Check the local collection files";
          nowPlayingTitle.textContent = "Nothing queued";
          currentTimeEl.textContent = "0:00";
          totalTimeEl.textContent = "0:00";
          renderPlaylist();
          return;
        }

        setControlsEnabled(true);
        loadTrack(0, false);
      }

      function loadTrack(index, shouldAutoplay = false) {
        if (!tracks.length) return;

        currentIndex = (index + tracks.length) % tracks.length;
        const currentTrack = tracks[currentIndex];

        audio.pause();
        audio.src = currentTrack.file;
        audio.load();
        currentTimeEl.textContent = "0:00";
        progressInput.value = "0";
        setTrackVisuals();

        if (shouldAutoplay) playCurrentTrack();
      }

      async function playCurrentTrack() {
        try {
          await audio.play();
        } catch (error) {
          console.error("Playback could not start.", error);
          isPlaying = false;
          updatePlayButton();
        }
      }

      function selectTrack(index) {
        closeInfoPanel();
        loadTrack(index, true);
      }

      function togglePlay() {
        if (!tracks.length) return;

        if (audio.paused) {
          playCurrentTrack();
        } else {
          audio.pause();
        }
      }

      playPauseBtn.addEventListener("click", togglePlay);
      prevBtn.addEventListener("click", () => loadTrack(currentIndex - 1, isPlaying));
      nextBtn.addEventListener("click", () => loadTrack(currentIndex + 1, isPlaying));

      audio.addEventListener("play", () => {
        isPlaying = true;
        updatePlayButton();
      });

      audio.addEventListener("pause", () => {
        isPlaying = false;
        updatePlayButton();
      });

      audio.addEventListener("loadedmetadata", () => {
        const durationText = formatTime(Math.round(audio.duration || 0));
        totalTimeEl.textContent = durationText;
      });

      audio.addEventListener("timeupdate", () => {
        const progressValue = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
        progressInput.value = String(progressValue);
        currentTimeEl.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener("ended", () => {
        loadTrack(currentIndex + 1, true);
      });

      audio.addEventListener("error", () => {
        if (!audio.currentSrc) return;
        nowPlayingTitle.textContent = "Unable to play this track";
      });

      progressInput.addEventListener("input", () => {
        if (audio.duration) {
          audio.currentTime = (Number(progressInput.value) / 100) * audio.duration;
        }
      });

      volumeInput.addEventListener("input", () => {
        const nextVolume = Number(volumeInput.value);
        audio.muted = false;
        audio.volume = nextVolume;
        if (nextVolume > 0) lastVolume = nextVolume;
      });

      volumeBtn.addEventListener("click", () => {
        if (audio.muted || audio.volume === 0) {
          audio.muted = false;
          audio.volume = lastVolume || 0.8;
        } else {
          lastVolume = audio.volume;
          audio.muted = true;
        }
      });

      audio.addEventListener("volumechange", updateVolumeButton);

      trackList.addEventListener("click", (event) => {
        const infoButton = event.target.closest(".track-info-btn");
        if (infoButton) {
          toggleInfoPanel(Number(infoButton.dataset.infoIndex));
          return;
        }

        const trackButton = event.target.closest(".track-select");
        if (trackButton) selectTrack(Number(trackButton.dataset.trackIndex));
      });

      closeInfoBtn.addEventListener("click", closeInfoPanel);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && trackInfo.classList.contains("visible")) closeInfoPanel();
      });

      audio.volume = 0.8;
      updatePlayButton();
      updateVolumeButton();
      refreshIcons();
      loadTrackData();
    </script>
  </body>
</html>
